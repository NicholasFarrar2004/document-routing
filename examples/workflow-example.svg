<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1080" viewBox="0 0 680 1080" role="img" aria-labelledby="title description">
<title id="title">Five fictional documents, three verified copies</title>
<desc id="description">Illustration of the tested command-line example, not an app screenshot. Five fictional exhibit documents produce three proposed destinations and two review items. Only the three routed files enter preview. Explicit execution verifies three copies. Repeating skips all three identical files.</desc>
<rect width="680" height="1080" fill="#f8f6f0"/>
<path d="M32 32H648M32 1030H648" stroke="#272b2a" stroke-width="3"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#272b2a">
<text x="32" y="65" font-size="15" font-weight="700" fill="#96503b" letter-spacing="1.3">DOCUMENT ROUTING · FICTIONAL EXAMPLE</text>
<text x="32" y="112" font-size="34" font-weight="700" fill="#272b2a">From names to verified copies</text>
<text x="32" y="144" font-size="20" font-weight="400" fill="#555c58">Workflow illustration, not an app screenshot.</text>
<path d="M32 187H648" stroke="#b9bcb3" stroke-width="1"/>
<rect x="32" y="209" width="38" height="38" fill="#96503b"/>
<text x="45" y="236" font-size="22" font-weight="700" fill="#f8f6f0">1</text>
<text x="92" y="236" font-size="26" font-weight="700" fill="#272b2a">5 fictional documents</text>
<text x="92" y="276" font-size="22" font-weight="400" fill="#414844">Names are scanned; contents stay unread.</text>
<text x="92" y="306" font-size="22" font-weight="400" fill="#414844">Label, lighting, mixed, unknown, sketch.</text>
<path d="M51 258V337m-5 -6 5 6 5 -6" stroke="#96503b" stroke-width="1.5" fill="none"/>
<path d="M32 353H648" stroke="#b9bcb3" stroke-width="1"/>
<rect x="32" y="375" width="38" height="38" fill="#96503b"/>
<text x="45" y="402" font-size="22" font-weight="700" fill="#f8f6f0">2</text>
<text x="92" y="402" font-size="26" font-weight="700" fill="#272b2a">3 destinations · 2 review items</text>
<text x="92" y="442" font-size="22" font-weight="400" fill="#414844">3 files match one destination each.</text>
<text x="92" y="472" font-size="22" font-weight="400" fill="#414844">2 files have conflicting or missing signals.</text>
<text x="92" y="502" font-size="22" font-weight="400" fill="#414844">Only 3 routed rows enter the copy catalog.</text>
<path d="M51 424V532m-5 -6 5 6 5 -6" stroke="#96503b" stroke-width="1.5" fill="none"/>
<path d="M32 548H648" stroke="#b9bcb3" stroke-width="1"/>
<rect x="32" y="570" width="38" height="38" fill="#96503b"/>
<text x="45" y="597" font-size="22" font-weight="700" fill="#f8f6f0">3</text>
<text x="92" y="597" font-size="26" font-weight="700" fill="#272b2a">Preview: 3 files</text>
<text x="92" y="637" font-size="22" font-weight="400" fill="#414844">3 WOULD_COPY. No destination created.</text>
<path d="M51 619V669m-5 -6 5 6 5 -6" stroke="#96503b" stroke-width="1.5" fill="none"/>
<path d="M32 685H648" stroke="#b9bcb3" stroke-width="1"/>
<rect x="32" y="707" width="38" height="38" fill="#96503b"/>
<text x="45" y="734" font-size="22" font-weight="700" fill="#f8f6f0">4</text>
<text x="92" y="734" font-size="26" font-weight="700" fill="#272b2a">Explicit copy: 3 verified</text>
<text x="92" y="774" font-size="22" font-weight="400" fill="#414844">3 COPIED_VERIFIED results.</text>
<text x="92" y="804" font-size="22" font-weight="400" fill="#414844">Source and copy content hashes match.</text>
<path d="M51 756V835m-5 -6 5 6 5 -6" stroke="#96503b" stroke-width="1.5" fill="none"/>
<path d="M32 851H648" stroke="#b9bcb3" stroke-width="1"/>
<rect x="32" y="873" width="38" height="38" fill="#96503b"/>
<text x="45" y="900" font-size="22" font-weight="700" fill="#f8f6f0">5</text>
<text x="92" y="900" font-size="26" font-weight="700" fill="#272b2a">Repeat: 3 identical skips</text>
<text x="92" y="940" font-size="22" font-weight="400" fill="#414844">3 SKIP_IDENTICAL. Sources unchanged.</text>
<text x="32" y="1062" font-size="19" font-weight="400" fill="#555c58">Counts match the tested public example.</text>
</g>
</svg>
